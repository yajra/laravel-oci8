name: Static Analysis

on:
  push:
    branches:
      - master
      - '*.x'

  pull_request:

  schedule:
    - cron: '0 0 * * *'

jobs:
  static-analysis-phpstan:

    name: Source Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: oci8
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 5
          command: |
            # TODO: Remove this fork override after BLOB stream return testing is complete.
            composer config repositories.pdo-via-oci8 vcs https://github.com/csaba215/pdo-via-oci8.git
            composer require --no-update --no-interaction "yajra/laravel-pdo-via-oci8:dev-feature/return-blobs-as-stream as 3.7.1"
            composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Run Static Analysis
        run: vendor/bin/phpstan
